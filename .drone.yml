kind: pipeline
type: docker
name: nestjs_api_ci

steps:
  - name: check_readme
    image: jjvargass/qa_develoment:latest
    commands:
      - python /app/check_readme.py
    when:
      branch:
        - develop
        - feature/*
        - release/*
      event:
        - push

  - name: check_branch
    image: jjvargass/qa_develoment:latest
    commands:
      - python /app/check_branch.py -H ${DRONE_GIT_HTTP_URL}
    when:
      branch:
        - develop
        - feature/*
        - release/*
      event:
        - push

  - name: check_commits
    image: jjvargass/qa_develoment:latest
    commands:
      - python /app/check_commits.py
    when:
      branch:
        - develop
        - feature/*
        - release/*
      event:
        - push

  - name: install_dependencies
    image: node:24-alpine
    commands:
      - npm install -g pnpm
      - pnpm install
    when:
      branch:
        - develop
        - release/*
        - master
      event:
        - push

  - name: lint
    image: node:24-alpine
    commands:
      - npm install -g pnpm
      - pnpm install
      - pnpm run lint:ci
    when:
      branch:
        - feature/*
      event:
        - push


  - name: diag_runner
    image: node:24-alpine
    commands:
      - uname -a; node -v; id
      - grep -E '^(Seccomp|NoNewPrivs|CapEff)' /proc/self/status
      - env | grep -E '^DRONE_(RUNNER|SYSTEM_HOST|STAGE_ARCH|STAGE_OS)' || true
      - mount | grep -E ' /drone/src | / ' || true
      - |
        node -e '
        const fs = require("fs");
        for (const dir of ["/drone/src", "/tmp", "/dev/shm"]) {
          const p = dir + "/diag.tmp";
          const fd = fs.openSync(p, "w");
          const tests = {
            write:      () => fs.writeSync(fd, "a"),
            pwrite_str: () => fs.writeSync(fd, "a", 0, "utf8"),
            pwrite_buf: () => fs.writeSync(fd, Buffer.from("a"), 0, 1, 0),
            fsync:      () => fs.fsyncSync(fd),
          };
          for (const [name, fn] of Object.entries(tests)) {
            try { fn(); console.log(dir, name, "OK"); } catch (e) { console.log(dir, name, e.code); }
          }
          fs.closeSync(fd);
          fs.open(p, "w", (err, afd) => {
            if (err) return console.log(dir, "async_open", err.code);
            fs.write(afd, "a", 0, "utf8", e => console.log(dir, "async_pwrite", e ? e.code : "OK"));
          });
        }'
    when:
      branch:
        - feature/*
      event:
        - push

  - name: unit_tests
    image: node:24-alpine
    commands:
      - npm install -g pnpm
      - pnpm install
      - pnpm run test:ci
    when:
      branch:
        - feature/*
      event:
        - push

  - name: build
    image: node:24-alpine
    commands:
      - npm install -g pnpm
      - pnpm install
      - pnpm run build
    when:
      branch:
        - develop
        - release/*
        - feature/*
        - master
      event:
        - push

  - name: run_sonar_scanner
    image: sonarsource/sonar-scanner-cli:latest
    environment:
      SONAR_HOST_URL:
        from_secret: SONAR_HOST
      SONAR_TOKEN:
        from_secret: SONAR_TOKEN
      SONAR_SCANNER_OPTS: "-Dsonar.working.directory=/tmp/.scannerwork"
    commands:
      - sonar-scanner
    when:
      branch:
        - feature/*
        - develop
        - release/*
        - hotfix/*
        - master
      event:
      - push

  - name: publish_to_ecr_release
    image: plugins/ecr
    settings:
      access_key:
        from_secret: AWS_ACCESS_KEY_ID
      secret_key:
        from_secret: AWS_SECRET_ACCESS_KEY
      region:
        from_secret: AWS_REGION
      repo: ${DRONE_REPO##udistrital/}
      tags:
        - ${DRONE_COMMIT:0:7}
        - release
    when:
      branch:
        - release/*
      event:
        - push

  - name: publish_to_ecr_master
    image: plugins/ecr
    settings:
      access_key:
        from_secret: AWS_ACCESS_KEY_ID
      secret_key:
        from_secret: AWS_SECRET_ACCESS_KEY
      region:
        from_secret: AWS_REGION
      repo: ${DRONE_REPO##udistrital/}
      tags:
        - ${DRONE_COMMIT:0:7}
        - latest
    when:
      branch:
        - master
      event:
        - push

  - name: update_aws_ecs
    image: amazon/aws-cli
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        from_secret: AWS_SECRET_ACCESS_KEY
      AWS_CONTAINER:
        from_secret: AWS_CONTAINER
    commands:
      - |
        case ${DRONE_BRANCH} in
          release/*)
            AMBIENTE=test
            CLUSTER=test
            MYCONTAINER=$${AWS_CONTAINER}/${DRONE_REPO##udistrital/}:release
            ;;
          master)
            AMBIENTE=prod
            CLUSTER=oas
            MYCONTAINER=$${AWS_CONTAINER}/${DRONE_REPO##udistrital/}:latest
            ;;
        esac
      - AWS_REGION=us-east-1
      - SERVICE=${DRONE_REPO##udistrital/}_$AMBIENTE
      - MYCONTAINER=oas0/${DRONE_REPO##udistrital/}:${DRONE_COMMIT:0:7}
      - aws ecs update-service --cluster $CLUSTER --service $SERVICE --force-new-deployment
    when:
      branch:
        - release/*
        - master
      event:
        - push
